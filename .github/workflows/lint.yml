name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint
        run: |
          mkdir -p build/logs
          set -o pipefail
          ./vendor/bin/pint --test | tee build/logs/pint.txt

      - name: Write lint summary
        if: always()
        run: |
          {
            echo "## Lint summary"
            echo ""
            echo "- Tool: Pint"
            echo "- Mode: test-only"
            echo "- Artifact: build/logs/pint.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-pint-output
          path: build/logs/pint.txt
          if-no-files-found: warn
          retention-days: 7

