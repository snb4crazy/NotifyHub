name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite, pdo_sqlite, mbstring, dom, fileinfo
          tools: composer:v2
          coverage: xdebug
          ini-values: memory_limit=-1, post_max_size=256M, upload_max_filesize=256M

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare SQLite database
        run: |
          mkdir -p database build/logs
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --log-junit=build/logs/junit.xml --coverage-clover=build/logs/clover.xml | tee build/logs/test-output.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "- Workflow: \\`${{ github.workflow }}\\`"
            echo "- Ref: \\`${{ github.ref }}\\`"
            echo "- PHP: \\`${{ matrix.php }}\\`"
            echo "- Database: SQLite file (\\`database/database.sqlite\\`)"
            echo "- Composer cache: enabled"
            echo "- Artifacts: \\`build/logs\\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts-php${{ matrix.php }}
          path: build/logs
          if-no-files-found: warn
          retention-days: 7

